version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Um único PR com todas as atualizações menores e de correção do mês.
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Saltos de versão maior (TypeScript 7, ioredis 6...) são feitos à mão,
      # com planejamento, e não em PRs automáticos que sempre quebram o CI.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
